<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SpinPick – Random Picker Wheel</title>
  <meta name="description" content="Free spin the wheel random picker. Add names, offers or prizes, customize everything and spin to pick a winner." />
  <meta name="theme-color" content="#0f1420" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SpinPick – Random Picker Wheel" />
  <meta property="og:description" content="Add names, offers or prizes, customize everything and spin to pick a winner." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;800&family=Bangers&family=Bebas+Neue&family=Fredoka:wght@500;700&family=Hind+Siliguri:wght@500;700&family=Montserrat:wght@600;800&family=Noto+Sans+Bengali:wght@500;700&family=Nunito:wght@700;900&family=Poppins:wght@400;500;600;700&family=Righteous&display=swap" rel="stylesheet" />
  <style>:root{--bg: #0f1420;--bg2: #161d2d;--card: #1c2436;--line: #2a3550;--text: #e9eef8;--muted: #8f9bb3;--accent: #ff5a36;--pointer: #ff5a36;--danger: #ff4d6d;--shadow: 0 20px 50px rgba(0,0,0,.45);}:root[data-theme="light"]{--bg: #f3f5fa;--bg2: #ffffff;--card: #ffffff;--line: #dde3ee;--text: #1b2333;--muted: #6b7690;--shadow: 0 20px 50px rgba(30,40,70,.18);}*{box-sizing: border-box;}html,body{margin: 0;height: 100%;}body{font-family: "Poppins","Hind Siliguri",system-ui,sans-serif;background: var(--bg);color: var(--text);display: flex;flex-direction: column;}button{font: inherit;cursor: pointer;}.hidden{display: none !important;}[hidden]{display: none !important;}.topbar{display: flex;align-items: center;justify-content: space-between;padding: 10px 20px;background: var(--bg2);border-bottom: 1px solid var(--line);}.brand{display: flex;align-items: center;gap: 8px;font-size: 1.35rem;color: var(--text);text-decoration: none;font-weight: 500;}.brand b{color: var(--accent);font-weight: 700;}.brand-dot{width: 22px;height: 22px;border-radius: 50%;background: conic-gradient(#ff5a36 0 25%,#ffb020 0 50%,#22c55e 0 75%,#3b82f6 0);}.icon-btn{background: transparent;border: 1px solid var(--line);color: var(--text);width: 38px;height: 38px;border-radius: 10px;font-size: 1.05rem;}.icon-btn:hover{border-color: var(--accent);}.layout{flex: 1;display: grid;grid-template-columns: 1fr 390px;min-height: 0;}.stage{position: relative;display: flex;flex-direction: column;align-items: center;justify-content: center;padding: 16px;overflow: hidden;background: radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 62%);}.stage-tools{position: absolute;top: 12px;left: 16px;right: 16px;z-index: 3;display: flex;justify-content: space-between;align-items: center;gap: 8px;}.stage-tools>div{display: flex;gap: 8px;}.stage-tools .icon-btn{background: color-mix(in srgb,var(--bg2) 70%,transparent);}.wheel-title{background: transparent;border: 1px dashed transparent;color: var(--text);font: 600 1.1rem "Poppins","Hind Siliguri",sans-serif;padding: 6px 10px;border-radius: 8px;max-width: 60%;text-shadow: 0 1px 3px rgba(0,0,0,.3);}.wheel-title:hover,.wheel-title:focus{border-color: var(--line);outline: none;}.wheel-wrap{position: relative;width: min(calc(100vh - 190px),100%,640px);aspect-ratio: 1;margin-top: 40px;filter: drop-shadow(var(--shadow));}#wheel{width: 100%;height: 100%;display: block;cursor: pointer;will-change: filter;}.pointer{position: absolute;top: -14px;left: 50%;transform: translateX(-50%);width: 0;height: 0;z-index: 2;transform-origin: 50% 0;border-left: 20px solid transparent;border-right: 20px solid transparent;border-top: 44px solid var(--pointer);filter: drop-shadow(0 4px 4px rgba(0,0,0,.4));}.pointer.tick{animation: tick .1s ease-out;}@keyframes tick{50%{transform: translateX(-50%) rotate(-16deg);}}.hub{position: absolute;top: 50%;left: 50%;transform: translate(-50%,-50%);width: 20%;aspect-ratio: 1;border-radius: 50%;border: 6px solid #fff;background: var(--accent);color: #fff;font-weight: 700;font-size: clamp(.75rem,2.3vw,1.25rem);letter-spacing: 1px;box-shadow: 0 6px 18px rgba(0,0,0,.35),inset 0 -6px 12px rgba(0,0,0,.18);transition: transform .15s;overflow: hidden;white-space: nowrap;padding: 0;}.hub:hover{transform: translate(-50%,-50%) scale(1.06);}.hub:disabled{cursor: wait;}.hint{color: var(--muted);font-size: .85rem;margin: 18px 0 0;text-align: center;}kbd{background: var(--card);border: 1px solid var(--line);border-radius: 4px;padding: 1px 6px;font-size: .78rem;}.wheel-wrap.shake{animation: shake .55s cubic-bezier(.36,.07,.19,.97);}@keyframes shake{10%{transform: translate(-6px,3px) scale(1.04);}20%{transform: translate(7px,-4px) scale(1.05);}30%{transform: translate(-7px,-3px) scale(1.04);}45%{transform: translate(5px,4px) scale(1.03);}60%{transform: translate(-4px,2px) scale(1.02);}80%{transform: translate(2px,-1px) scale(1.01);}}#flash{position: fixed;inset: 0;pointer-events: none;z-index: 45;opacity: 0;background: radial-gradient(circle at 50% 50%,rgba(255,255,255,.95),var(--flash,#fff) 25%,transparent 70%);}#flash.on{animation: flash .7s ease-out;}@keyframes flash{0%{opacity: .9;}100%{opacity: 0;}}.panel{background: var(--bg2);border-left: 1px solid var(--line);display: flex;flex-direction: column;min-height: 0;}.tabs{display: flex;border-bottom: 1px solid var(--line);}.tab{flex: 1;background: none;border: none;color: var(--muted);padding: 14px 6px;font-weight: 600;font-size: .92rem;border-bottom: 2px solid transparent;}.tab.active{color: var(--text);border-bottom-color: var(--accent);}.badge{background: var(--accent);color: #fff;border-radius: 999px;padding: 1px 8px;font-size: .72rem;margin-left: 4px;}.tab-body{padding: 14px;display: flex;flex-direction: column;gap: 12px;overflow-y: auto;flex: 1;}.toolbar{display: flex;flex-wrap: wrap;gap: 6px;}.chip{background: var(--card);color: var(--text);border: 1px solid var(--line);border-radius: 8px;padding: 6px 10px;font-size: .82rem;}.chip:hover{border-color: var(--accent);}.chip.danger:hover{border-color: var(--danger);color: var(--danger);}textarea{width: 100%;min-height: 260px;resize: vertical;background: var(--card);color: var(--text);border: 1px solid var(--line);border-radius: 10px;padding: 12px;font: 400 .95rem/1.6 "Poppins","Hind Siliguri",sans-serif;}textarea:focus{outline: none;border-color: var(--accent);}.section{border: 1px solid var(--line);border-radius: 10px;padding: 10px 12px;background: var(--card);}.section summary{cursor: pointer;font-weight: 600;font-size: .85rem;letter-spacing: .3px;color: var(--muted);}.section[open] summary{margin-bottom: 8px;color: var(--text);}.presets{display: flex;flex-wrap: wrap;gap: 6px;}.palettes{display: grid;grid-template-columns: repeat(3,1fr);gap: 8px;margin-bottom: 10px;}.palette{display: flex;height: 28px;border-radius: 8px;overflow: hidden;border: 2px solid transparent;padding: 0;position: relative;}.palette span{flex: 1;}.palette.active{border-color: var(--text);box-shadow: 0 0 0 2px var(--accent);}.palette-label{font-size: .75rem;color: var(--muted);margin: 4px 0 6px;}.swatches{display: flex;flex-wrap: wrap;gap: 6px;align-items: center;}.swatch{position: relative;}.swatch-x{position: absolute;top: -6px;right: -6px;width: 16px;height: 16px;border-radius: 50%;border: none;background: var(--danger);color: #fff;font-size: 11px;line-height: 16px;padding: 0;}.row{display: flex;justify-content: space-between;align-items: center;gap: 10px;padding: 7px 0;font-size: .88rem;border-top: 1px dashed var(--line);}.row:first-of-type{border-top: none;}.row>label{flex: 1;}.row .ctrl{display: flex;align-items: center;gap: 6px;}.row output{min-width: 42px;text-align: right;font-variant-numeric: tabular-nums;color: var(--muted);font-size: .8rem;}.row input[type="range"]{width: 120px;}.row input[type="text"],.row select{background: var(--bg2);color: var(--text);border: 1px solid var(--line);border-radius: 8px;padding: 6px 8px;font: inherit;font-size: .85rem;max-width: 170px;}.row input[type="text"]:focus,.row select:focus{outline: none;border-color: var(--accent);}input[type="color"]{width: 38px;height: 28px;padding: 0;border: 1px solid var(--line);border-radius: 6px;background: none;cursor: pointer;}input[type="color"]::-webkit-color-swatch-wrapper{padding: 2px;}input[type="color"]::-webkit-color-swatch{border: none;border-radius: 4px;}input[type="checkbox"],input[type="range"]{accent-color: var(--accent);}input[type="checkbox"]{width: 18px;height: 18px;cursor: pointer;}.row small{color: var(--muted);}.results{margin: 0;padding-left: 26px;display: flex;flex-direction: column;gap: 6px;}.results li{background: var(--card);border: 1px solid var(--line);border-radius: 8px;padding: 8px 12px;}.results li small{color: var(--muted);float: right;}.empty{color: var(--muted);text-align: center;}.modal{position: fixed;inset: 0;background: rgba(5,8,15,.55);backdrop-filter: blur(3px);display: grid;place-items: center;z-index: 50;padding: 16px;}.modal-card{background: var(--card);border-radius: 18px;padding: 28px 28px 22px;width: min(480px,100%);text-align: center;box-shadow: var(--shadow);border-top: 8px solid var(--accent);animation: pop .45s cubic-bezier(.2,1.5,.4,1);}@keyframes pop{from{transform: scale(.6);opacity: 0;}}.modal-label{margin: 0;color: var(--muted);font-weight: 500;}.modal-card h2{font-size: clamp(1.7rem,6vw,2.8rem);margin: 10px 0 22px;word-break: break-word;}.modal-actions{display: flex;gap: 8px;justify-content: center;flex-wrap: wrap;}.btn{border-radius: 10px;padding: 10px 18px;font-weight: 600;border: 1px solid var(--line);}.btn.ghost{background: transparent;color: var(--text);}.btn.primary{background: var(--accent);color: #fff;border-color: var(--accent);}.toast{position: fixed;bottom: 24px;left: 50%;transform: translateX(-50%);background: var(--text);color: var(--bg);padding: 10px 18px;border-radius: 10px;z-index: 60;font-weight: 500;}#confetti{position: fixed;inset: 0;pointer-events: none;z-index: 55;width: 100%;height: 100%;}.stage:fullscreen .wheel-wrap{width: min(calc(100vh - 120px),95vw);}.top-actions{display: flex;gap: 8px;}.lang-btn{background: var(--card);color: var(--text);border: 1px solid var(--line);border-radius: 10px;padding: 0 12px;height: 38px;font-weight: 600;font-family: "Hind Siliguri","Poppins",sans-serif;}.lang-btn:hover{border-color: var(--accent);}.title-box{display: flex;align-items: center;gap: 8px;min-width: 0;flex: 1;}.title-box .wheel-title{max-width: 100%;min-width: 0;flex: 1;}.stage-logo{height: 40px;max-width: 120px;object-fit: contain;border-radius: 6px;}.hub.has-logo{background-size: contain;background-repeat: no-repeat;background-position: center;background-origin: content-box;padding: 12%;color: transparent;}.row.stack{flex-direction: column;align-items: stretch;gap: 6px;}.row.stack .ctrl{width: 100%;}textarea.small-ta{min-height: 70px;font-size: .85rem;padding: 8px 10px;background: var(--bg2);}.count-row{display: flex;align-items: center;justify-content: space-between;gap: 10px;font-size: .9rem;}.stepper{display: flex;align-items: center;gap: 6px;}.stepper .chip{width: 38px;font-size: 1.1rem;padding: 4px 0;}#countInput{width: 64px;text-align: center;background: var(--card);color: var(--text);border: 1px solid var(--line);border-radius: 8px;padding: 6px;font: inherit;}#countInput:focus{outline: none;border-color: var(--accent);}.lead-form{display: flex;flex-direction: column;gap: 10px;text-align: left;margin: 4px 0 14px;}.lead-form h3{margin: 0 0 4px;text-align: center;font-size: 1.05rem;}.field{display: flex;flex-direction: column;gap: 5px;font-size: .85rem;color: var(--muted);}.field input,.field textarea{background: var(--bg2);color: var(--text);border: 1px solid var(--line);border-radius: 10px;padding: 11px 12px;font: inherit;font-size: 1rem;}.field input:focus{outline: none;border-color: var(--accent);}.consent{display: flex;gap: 10px;align-items: flex-start;font-size: .82rem;line-height: 1.45;cursor: pointer;}.consent input{flex: none;margin-top: 2px;}.form-error{color: var(--danger);font-size: .85rem;margin: 0;min-height: 1.1em;}.lead-thanks{color: #22c55e;font-weight: 600;margin: 0 0 14px;}.btn.wa{background: #25d366;color: #fff;border-color: #25d366;text-decoration: none;display: inline-flex;align-items: center;justify-content: center;}.leads{list-style: none;margin: 8px 0 0;padding: 0;display: flex;flex-direction: column;gap: 6px;}.leads li{background: var(--bg2);border: 1px solid var(--line);border-radius: 8px;padding: 8px 10px;font-size: .85rem;}.leads li small{display: block;color: var(--muted);}.note{color: var(--muted);font-size: .8rem;margin: 4px 0 8px;line-height: 1.45;}.modal-card.left{text-align: left;display: flex;flex-direction: column;gap: 10px;border-top-color: var(--accent);}.modal-card.left h3{margin: 0 0 4px;}.modal-card.left .chip{align-self: flex-start;}textarea.code{min-height: 110px;font: .78rem/1.5 ui-monospace,Consolas,monospace;resize: none;}body.embed .topbar,body.embed .panel,body.embed .hint,body.embed .mobile-bar{display: none !important;}body.embed{padding-bottom: 0 !important;}body.embed .layout{grid-template-columns: 1fr;}body.embed .wheel-wrap{width: min(calc(100vh - 80px),100%,640px);margin-top: 36px;}.mobile-bar{display: none;}@media (max-width: 900px){body{padding-bottom: calc(80px + env(safe-area-inset-bottom));}.layout{grid-template-columns: 1fr;}.panel{border-left: none;border-top: 1px solid var(--line);}.stage{padding-top: 60px;}.wheel-wrap{width: min(92vw,520px);margin-top: 0;}textarea{min-height: 180px;}.hint{display: none;}.mobile-bar{display: flex;gap: 10px;position: fixed;left: 0;right: 0;bottom: 0;z-index: 30;padding: 10px 14px calc(10px + env(safe-area-inset-bottom));background: color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter: blur(8px);border-top: 1px solid var(--line);}.mobile-spin{flex: 1;height: 58px;border: none;border-radius: 16px;background: var(--accent);color: #fff;font-weight: 700;font-size: 1.25rem;letter-spacing: 1px;box-shadow: 0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);}.mobile-spin:disabled{opacity: .7;}.mobile-bar .icon-btn{width: 58px;height: 58px;border-radius: 16px;font-size: 1.3rem;background: var(--card);}.chip{min-height: 42px;padding: 8px 14px;font-size: .9rem;}.stepper .chip{width: 46px;}#countInput{height: 42px;}.tab{padding: 16px 6px;font-size: .95rem;}.row{padding: 10px 0;}.row input[type="range"]{width: 130px;}input[type="checkbox"]{width: 22px;height: 22px;}input[type="color"]{width: 46px;height: 34px;}textarea,#countInput,.row input[type="text"],.row select,.field input{font-size: 16px;}.modal{place-items: end center;padding: 0;}.modal-card{width: 100%;max-height: 92vh;overflow-y: auto;border-radius: 22px 22px 0 0;padding-bottom: calc(22px + env(safe-area-inset-bottom));animation: sheet .35s ease-out;}.modal-actions{flex-direction: column;}.modal-actions .btn{width: 100%;min-height: 52px;font-size: 1rem;}}@keyframes sheet{from{transform: translateY(100%);}}</style>
  <script>
    /* Site owner settings. leadWebhook: an https URL that receives WhatsApp leads as JSON (POST).
       It is set here and not in share links, so nobody else can redirect your leads. */
    window.SPINPICK_CONFIG = { leadWebhook: "" };
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <span class="brand-dot"></span><span>Spin<b>Pick</b></span>
    </a>
    <div class="top-actions">
      <button class="lang-btn" id="langBtn" title="বাংলা / English">বাংলা</button>
      <button class="icon-btn" id="themeBtn" data-i18n-title="themeTitle" title="Light / dark mode">◐</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div class="stage-tools">
        <div class="title-box">
          <img id="stageLogo" class="stage-logo" alt="" hidden />
          <input id="wheelTitle" class="wheel-title" maxlength="40" aria-label="Wheel title" />
        </div>
        <div>
          <button class="icon-btn" id="soundBtn" data-i18n-title="soundTitle" title="Sound on / off">🔊</button>
          <button class="icon-btn" id="fullBtn" data-i18n-title="fullTitle" title="Fullscreen">⛶</button>
        </div>
      </div>

      <div class="wheel-wrap" id="wheelWrap">
        <div class="pointer" id="pointer"></div>
        <canvas id="wheel" width="1000" height="1000" aria-label="Spinning wheel"></canvas>
        <button class="hub" id="spinBtn" aria-label="Spin">SPIN</button>
      </div>
      <p class="hint" data-i18n-html="hint"></p>
    </section>

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="entries"><span data-i18n="tabEntries">Entries</span> <span class="badge" id="entryCount">0</span></button>
        <button class="tab" data-tab="customize"><span data-i18n="tabCustomize">Customize</span></button>
        <button class="tab" data-tab="results"><span data-i18n="tabResults">Results</span> <span class="badge" id="resultCount">0</span></button>
      </div>

      <div class="tab-body" id="tab-entries">
        <div class="toolbar">
          <button class="chip" id="shuffleBtn">⤮ <span data-i18n="shuffle">Shuffle</span></button>
          <button class="chip" id="sortBtn">↕ <span data-i18n="sort">Sort</span></button>
          <button class="chip" id="uniqueBtn">◎ <span data-i18n="unique">Unique</span></button>
          <button class="chip" id="shareBtn">🔗 <span data-i18n="share">Share</span></button>
          <button class="chip" id="embedBtn">&lt;/&gt; <span data-i18n="embed">Embed</span></button>
          <button class="chip danger" id="clearBtn">✕ <span data-i18n="clear">Clear</span></button>
        </div>
        <div class="count-row">
          <span data-i18n="itemCount">Number of items</span>
          <div class="stepper">
            <button class="chip" id="countMinus" aria-label="−">−</button>
            <input id="countInput" type="number" min="0" max="500" inputmode="numeric" aria-label="Number of items" />
            <button class="chip" id="countPlus" aria-label="+">+</button>
          </div>
        </div>
        <textarea id="entries" spellcheck="false" data-i18n-ph="entriesPh"></textarea>
        <details class="section" open>
          <summary data-i18n="presets">Presets</summary>
          <div class="presets" id="presets"></div>
        </details>
      </div>

      <div class="tab-body hidden" id="tab-customize"></div>

      <div class="tab-body hidden" id="tab-results">
        <div class="toolbar">
          <button class="chip" id="copyResultsBtn">⧉ <span data-i18n="copy">Copy</span></button>
          <button class="chip danger" id="clearResultsBtn">✕ <span data-i18n="clear">Clear</span></button>
        </div>
        <ol class="results" id="results"></ol>
        <p class="empty" id="resultsEmpty" data-i18n="noSpins">No spins yet.</p>

        <details class="section" id="leadsSection" open>
          <summary><span data-i18n="leads">WhatsApp leads</span> (<span id="leadCount">0</span>)</summary>
          <p class="note" data-i18n="leadsNote"></p>
          <div class="toolbar">
            <button class="chip" id="exportLeadsBtn">⬇ <span data-i18n="exportCsv">Export CSV</span></button>
            <button class="chip danger" id="clearLeadsBtn">✕ <span data-i18n="clear">Clear</span></button>
          </div>
          <ul class="leads" id="leadsList"></ul>
          <p class="empty" id="leadsEmpty" data-i18n="noLeads"></p>
        </details>
      </div>
    </aside>
  </main>

  <!-- mobile one-hand bar -->
  <nav class="mobile-bar" id="mobileBar">
    <button class="icon-btn" id="mSound" data-i18n-title="soundTitle">🔊</button>
    <button class="mobile-spin" id="mSpin">SPIN</button>
    <button class="icon-btn" id="mEdit" data-i18n-title="editTitle">✏️</button>
  </nav>

  <!-- winner -->
  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="winnerName">
    <div class="modal-card" id="modalCard">
      <p class="modal-label" id="winLabel"></p>
      <h2 id="winnerName">—</h2>
      <div id="winLeadSlot"></div>
      <p class="lead-thanks hidden" id="leadThanks"></p>
      <div class="modal-actions">
        <button class="btn ghost" id="closeModal" data-i18n="close">Close</button>
        <button class="btn ghost" id="removeWinner" data-i18n="remove">Remove</button>
        <a class="btn wa hidden" id="claimBtn" target="_blank" rel="noopener" data-i18n="claim">Claim on WhatsApp</a>
        <button class="btn primary" id="spinAgain" data-i18n="spinAgain">Spin again</button>
      </div>
    </div>
  </div>

  <!-- WhatsApp lead form (moved between the lead modal and the winner modal) -->
  <div class="modal hidden" id="leadModal" role="dialog" aria-modal="true" aria-labelledby="leadTitle">
    <div class="modal-card" id="leadCard">
      <form id="leadForm" class="lead-form" novalidate>
        <h3 id="leadTitle"></h3>
        <label class="field" id="leadNameField"><span data-i18n="leadName">Name (optional)</span>
          <input id="leadName" type="text" autocomplete="name" maxlength="60" />
        </label>
        <label class="field"><span data-i18n="leadPhone">WhatsApp number</span>
          <input id="leadPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="01XXXXXXXXX" />
        </label>
        <label class="consent"><input type="checkbox" id="leadConsent" /><span id="leadConsentText"></span></label>
        <p class="form-error" id="leadError" role="alert"></p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="leadCancel"></button>
          <button type="submit" class="btn primary" id="leadSubmit"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- share & embed -->
  <div class="modal hidden" id="embedModal" role="dialog" aria-modal="true" aria-labelledby="embedTitle">
    <div class="modal-card left">
      <h3 id="embedTitle" data-i18n="embedTitle">Share &amp; embed</h3>
      <label class="field"><span data-i18n="shareLink">Share link</span>
        <input id="shareUrl" type="text" readonly />
      </label>
      <button class="chip" id="copyShare">⧉ <span data-i18n="copyLink">Copy link</span></button>
      <label class="field"><span data-i18n="embedCode">Embed code (paste into your website HTML)</span>
        <textarea id="embedCode" class="code" readonly></textarea>
      </label>

      ctx.shadowBlur = 4;
      ctx.fillStyle = s.pegColor;
      for (let i = 0; i < n; i++) {
        const a = rotation + i * arc;
        ctx.beginPath();
        ctx.arc(c + Math.cos(a) * pr, c + Math.sin(a) * pr, ps, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function indexAtPointer() {
    const n = state.entries.length;
    if (!n) return -1;
    return Math.floor(mod(POINTER_ANGLE - rotation, TAU) / (TAU / n)) % n;
  }

  // ---------- Confetti & fireworks ----------
  const FX = (() => {
    const cv = $("confetti");
    const cx = cv.getContext("2d");
    let parts = [];
    let running = false;
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      cv.width = innerWidth * dpr;
      cv.height = innerHeight * dpr;
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function burst(x, y, count, colors, power = 1, angle = null, spread = TAU) {
      for (let i = 0; i < count; i++) {
        const a = angle === null ? rand() * TAU : angle + (rand() - 0.5) * spread;
        const sp = (4 + rand() * 10) * power;
        parts.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          s: 5 + rand() * 7, r: rand() * TAU, vr: (rand() - 0.5) * 0.4,
          c: colors[Math.floor(rand() * colors.length)],
          round: rand() < 0.3, life: 0, max: 140 + rand() * 90, wob: rand() * TAU,
        });
      }
      if (!running) { running = true; requestAnimationFrame(loop); }
    }
    function loop() {
      cx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of parts) {
        p.vy += 0.22; p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
        cx.globalAlpha = Math.max(0, Math.min(1, (p.max - p.life) / (p.max * 0.3)));
        cx.fillStyle = p.c;
        cx.save();
        cx.translate(p.x, p.y);
        cx.rotate(p.r);
        if (p.round) {
          cx.beginPath();
          cx.arc(0, 0, p.s / 2.5, 0, TAU);
          cx.fill();
        } else {
          cx.scale(1, Math.cos(p.life * 0.15 + p.wob));
          cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        }
        cx.restore();
      }
      cx.globalAlpha = 1;
      parts = parts.filter((p) => p.life < p.max && p.y < innerHeight + 40);
      if (parts.length) requestAnimationFrame(loop);
      else { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
    }
    function celebrate(colors, amount) {
      resize();
      const w = innerWidth, h = innerHeight;
      const per = Math.round(amount / 5);
      const r = $("wheelWrap").getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, Math.round(per * 1.4), colors, 1.2);
      setTimeout(() => {
        burst(0, h * 0.75, per, colors, 1.4, -Math.PI / 3, 0.6);
        burst(w, h * 0.75, per, colors, 1.4, (-2 * Math.PI) / 3, 0.6);
      }, 180);
      [450, 800, 1150].forEach((d) =>
        setTimeout(() => burst(w * (0.2 + rand() * 0.6), h * (0.15 + rand() * 0.3), Math.round(per * 0.6), colors, 0.8), d));
    }
    return { celebrate };
  })();

  // ---------- Spin ----------
  function setSpinButtons(disabled) {
    $("spinBtn").disabled = disabled;
    $("mSpin").disabled = disabled;
  }

  // entry point for every spin button: may ask for a WhatsApp number first
  function requestSpin() {
    if (spinning) return;
    if (!state.entries.length) { toast(t("tAddOne")); return; }
    if (S().leadMode === "before") { openLeadModal(); return; }
    spin();
  }

  function spin() {
    if (spinning) return;
    commitPendingRemove();
    const s = S();
    const n = state.entries.length;
    if (n < 1) { toast(t("tAddOne")); return; }
    $("modal").classList.add("hidden");
    highlightIdx = -1;
    spinning = true;
    setSpinButtons(true);
    Sound.unlock();
    Sound.whoosh(s.duration);

    const winner = Math.floor(rand() * n);
    const arc = TAU / n;
    const jitter = (rand() * 0.8 + 0.1) * arc;
    const landing = POINTER_ANGLE - (winner * arc + jitter);
    const from = rotation;
    const total = mod(landing - from, TAU) + s.turns * TAU;
    const ease = getEasing();
    const dur = s.duration * 1000;
    const t0 = performance.now();
    const pointer = $("pointer");
    let lastIdx = indexAtPointer();
    let lastTick = 0;

    function frame(now) {
      const p = Math.min(1, (now - t0) / dur);
      const prev = rotation;
      rotation = from + total * ease(p);
      if (s.motionBlur) {
        const b = Math.min(4, Math.abs(rotation - prev) * 5);
        canvas.style.filter = b > 0.4 ? `blur(${b.toFixed(1)}px)` : "";
      }
      draw();
      const idx = indexAtPointer();
      if (idx !== lastIdx) {
        lastIdx = idx;
        if (now - lastTick > 28) {
          lastTick = now;
          Sound.tick();
          pointer.classList.remove("tick");
          void pointer.offsetWidth;
          pointer.classList.add("tick");
        }
      }
      if (p < 1) requestAnimationFrame(frame);
      else finish(winner);
    }
    requestAnimationFrame(frame);
  }

  function finish(winnerIdx) {
    const s = S();
    rotation = mod(rotation, TAU);
    canvas.style.filter = "";
    spinning = false;
    setSpinButtons(false);
    lastWinnerIndex = winnerIdx;
    highlightIdx = winnerIdx;
    const n = state.entries.length;
    const name = state.entries[winnerIdx];
    lastWinnerName = name;
    const color = colorFor(winnerIdx, n);
    draw();

    state.results.unshift({ name, time: Date.now() });
    state.results = state.results.slice(0, 500);
    renderResults();

    if (gateLead) { // number collected before this spin: attach the result and send
      gateLead.result = name;
      sendLead(gateLead);
      gateLead = null;
      renderLeads();
    }

    Sound.win();
    if (s.flash && !reduceMotion) {
      const f = $("flash");
      f.style.setProperty("--flash", color);
      f.classList.remove("on");
      void f.offsetWidth;
      f.classList.add("on");
    }
    if (s.shake && !reduceMotion) {
      const w = $("wheelWrap");
      w.classList.remove("shake");
      void w.offsetWidth;
      w.classList.add("shake");
    }
    if (s.confetti) FX.celebrate([color, ...colorsList(), "#ffffff", "#ffd700"], s.confettiAmount);

    pendingRemove = s.autoRemove ? winnerIdx : -1;
    if (s.showPopup || s.leadMode === "after") {
      $("winLabel").textContent = s.winMessage || t("winMsgDefault");
      $("winnerName").textContent = name;
      $("modalCard").style.borderTopColor = color;
      $("removeWinner").classList.toggle("hidden", s.autoRemove);
      updateClaimButton(name);
      $("leadThanks").classList.add("hidden");
      if (s.leadMode === "after") {
        prepareLeadForm("after");
        $("winLeadSlot").append($("leadForm"));
      } else {
        $("leadCard").append($("leadForm"));
      }
      setTimeout(() => {
        $("modal").classList.remove("hidden");
        (s.leadMode === "after" ? $("leadPhone") : $("spinAgain")).focus();
      }, 350);
    } else {
      toast(`🎉 ${name}`);
    }
    save();
  }

  function updateClaimButton(prize) {
    const s = S();
    const wa = (s.waNumber || "").replace(/\D/g, "");
    const btn = $("claimBtn");
    if (wa.length >= 8) {

  function commitPendingRemove() {
    if (pendingRemove >= 0) {
      const i = pendingRemove;
      pendingRemove = -1;
      removeIndex(i);
    }
  }
  function removeIndex(i) {
    if (i < 0 || i >= state.entries.length) return;
    state.entries.splice(i, 1);
    lastWinnerIndex = -1;
    highlightIdx = -1;

    save();

  // ---------- WhatsApp lead form ----------
  function normalizePhone(raw) {
    let v = String(raw).trim().replace(/[০-৯]/g, (d) => BN_DIGITS.indexOf(d)).replace(/[\s\-().]/g, "");
    if (v.startsWith("+")) v = v.slice(1);
    else if (v.startsWith("00")) v = v.slice(2);
    else if (v.startsWith("0")) v = (S().defaultCountry || "").replace(/\D/g, "") + v.slice(1);
    return /^\d{8,15}$/.test(v) ? v : null;
  }
  function prepareLeadForm(mode) {
    const s = S();
    const form = $("leadForm");
    form.dataset.mode = mode;
    form.hidden = false;
    $("leadTitle").textContent = s.leadTitle || t(mode === "before" ? "leadTitleBefore" : "leadTitleAfter");
    $("leadNameField").hidden = !s.leadAskName;
    $("leadConsentText").textContent = s.consentText || t("consentDefault");
    $("leadSubmit").textContent = t(mode === "before" ? "submitSpin" : "submit");
    $("leadCancel").textContent = t(mode === "before" ? "cancel" : "skip");
    $("leadName").value = "";
    $("leadPhone").value = "";
    $("leadConsent").checked = false; // consent is never pre-ticked
    $("leadError").textContent = "";
  }
  function openLeadModal() {
    if (!$("modal").classList.contains("hidden")) closeModal();
    prepareLeadForm("before");
    $("leadCard").append($("leadForm"));
    $("leadModal").classList.remove("hidden");
    setTimeout(() => $("leadPhone").focus(), 50);
  }
  function submitLead(e) {
    e.preventDefault();
    const s = S();
    const mode = $("leadForm").dataset.mode;
    const phone = normalizePhone($("leadPhone").value);
    const err = $("leadError");
    if (!phone) { err.textContent = t("errPhone"); $("leadPhone").focus(); return; }
    if (!$("leadConsent").checked) { err.textContent = t("errConsent"); return; }
    if (s.onePerNumber && state.leads.some((l) => l.phone === "+" + phone)) { err.textContent = t("errUsed"); return; }

    const lead = {
      time: Date.now(),
      name: s.leadAskName ? $("leadName").value.trim().slice(0, 60) : "",
      phone: "+" + phone,
      result: mode === "after" ? lastWinnerName : "",
      wheel: s.title || t("myWheel"),
      consent: true,
      consentText: s.consentText || t("consentDefault"),
    };
    state.leads.unshift(lead);
    state.leads = state.leads.slice(0, 5000);
    renderLeads();
    save();

    if (mode === "before") {
      gateLead = lead;
      $("leadModal").classList.add("hidden");
      spin();
    } else {
      sendLead(lead);
      $("leadForm").hidden = true;
      $("leadThanks").textContent = t("thanks");
      $("leadThanks").classList.remove("hidden");
      $("spinAgain").focus();
    }
  }
  function sendLead(lead) {
    save();
    const url = isHttps(CONFIG.leadWebhook || "") ? CONFIG.leadWebhook : S().leadWebhook;
    if (!isHttps(url || "")) return;
    fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ ...lead, time: new Date(lead.time).toISOString() }),
    }).catch(() => {});
  }
  function renderLeads() {
    const ul = $("leadsList");

      ul.append(el("li", { textContent: `${l.phone} ${info}` }, el("small", { textContent: time })));

  function exportLeads() {
    const safe = (v) => {
      let x = String(v ?? "");
      if (/^[=+\-@]/.test(x)) x = "'" + x; // stop spreadsheet formulas
      return `"${x.replace(/"/g, '""')}"`;
    };
    const rows = [["Time", "Name", "WhatsApp", "Result", "Wheel", "Consent"]];
    state.leads.forEach((l) => rows.push([new Date(l.time).toLocaleString(), safe(l.name), `"${l.phone}"`, safe(l.result), safe(l.wheel), l.consent ? "yes" : "no"]));
    const csv = "﻿" + rows.map((r) => r.join(",")).join("\r\n");
    download(new Blob([csv], { type: "text/csv;charset=utf-8" }), "whatsapp-leads.csv");
  }

        const out = el("output", { textContent: s[key] + (item.unit || "") });
        const inp = el("input", { type: "range", min: item.min, max: item.max, step: item.step || 1, value: s[key] });
        inp.oninput = () => { out.textContent = inp.value + (item.unit || ""); setSetting(key, +inp.value); };
        box.append(inp, out);
        break;
      }
      case "color": {
        const inp = el("input", { type: "color", value: s[key] });
        inp.oninput = () => setSetting(key, inp.value);
        box.append(inp);
        break;
      }
      case "checkbox": {
        const inp = el("input", { type: "checkbox", checked: !!s[key] });
        inp.onchange = () => setSetting(key, inp.checked);
        box.append(inp);
        break;
      }
      case "select": {
        const sel = el("select");
        opt(item.options).forEach(([v, l]) =>
          sel.append(el("option", { value: v, textContent: item.raw ? l : t(l), selected: v === s[key] })));
        sel.onchange = () => setSetting(key, sel.value);
        box.append(sel);
        break;
      }
      case "text":
      case "textarea": {
        const inp = item.type === "text"
          ? el("input", { type: "text", value: s[key], maxLength: item.max || 40, placeholder: ph })
          : el("textarea", { value: s[key], maxLength: item.max || 300, placeholder: ph, rows: 3, className: "small-ta" });
        inp.oninput = () => {
          const v = inp.value.trim();
          if ((key === "logoUrl" || key === "leadWebhook") && v && !isHttps(v)) return; // only https links
          setSetting(key, key === "logoUrl" || key === "leadWebhook" ? v : inp.value);
        };
        if (item.type === "textarea") { row.classList.add("stack"); }
        box.append(inp);
        break;
      }
      case "file": {
        const status = el("small");
        const pick = el("button", { className: "chip", textContent: t("upload") });
        const del = el("button", { className: "chip danger", textContent: "✕" });
        const inp = el("input", { type: "file", accept: item.accept, hidden: true });
        const refresh = () => { status.textContent = S()[key] ? t("customSet") : t("none"); del.hidden = !S()[key]; };
        pick.onclick = () => inp.click();
        inp.onchange = () => {
          const f = inp.files[0];
          inp.value = "";
          if (!f) return;
          if (f.size > MAX_FILE) { toast(t("tTooLarge")); return; }
          const r = new FileReader();
          r.onload = () => { setSetting(key, r.result); refresh(); Sound.preload(); toast(t("tUploaded")); };
          r.readAsDataURL(f);
        };
        del.onclick = () => { setSetting(key, ""); refresh(); };
        refresh();
        box.append(status, pick, del, inp);
        break;
      }
      case "buttons": {
        row.style.justifyContent = "flex-start";
        box.style.flexWrap = "wrap";
        item.buttons.forEach(([label, fn]) => {
          const b = el("button", { className: "chip", textContent: t(label) });
          b.onclick = fn;
          box.append(b);
        });
        break;
      }
    }
    row.append(box);
    if (item.show) visRows.push([row, item.show]);
    return row;
  }

  function renderPalettes() {
    const s = S();
    paletteBox.innerHTML = "";
    const all = { ...PALETTES, Custom: s.customColors };
    Object.entries(all).forEach(([name, cols]) => {
      const b = el("button", { className: "palette" + (name === s.palette ? " active" : ""), title: name });
      cols.forEach((c) => { const sp = el("span"); sp.style.background = c; b.appendChild(sp); });
      b.onclick = () => { s.palette = name; renderPalettes(); applySettings(); save(); };
      paletteBox.appendChild(b);
    });
  }
  function renderCustomColors() {
    const s = S();
    colorsBox.innerHTML = "";
    s.customColors.forEach((c, i) => {
      const inp = el("input", { type: "color", value: c });
      inp.oninput = () => { s.customColors[i] = inp.value; s.palette = "Custom"; renderPalettes(); applySettings(); save(); };
      const x = el("button", { className: "swatch-x", textContent: "×", title: t("remove") });
      x.onclick = () => {
        if (s.customColors.length <= 2) { toast(t("tKeep2")); return; }
        s.customColors.splice(i, 1);
        s.palette = "Custom";
        renderCustomColors(); renderPalettes(); applySettings(); save();
      };
      colorsBox.append(el("span", { className: "swatch" }, inp, x));
    });
    const add = el("button", { className: "chip", textContent: t("addColor") });
    add.onclick = () => {
      if (s.customColors.length >= 24) return;
      s.customColors.push("#" + Math.floor(rand() * 0xffffff).toString(16).padStart(6, "0"));
      s.palette = "Custom";
      renderCustomColors(); renderPalettes(); applySettings(); save();
    };
    colorsBox.append(add);
  }

  function renderCustomize() {
    const host = $("tab-customize");
    const openNow = [...host.querySelectorAll("details")].map((d) => d.open);
    host.innerHTML = "";
    visRows.length = 0;
    SCHEMA.forEach((sec, si) => {
      const d = el("details", { className: "section", open: openNow.length ? openNow[si] : !!sec.open }, el("summary", { textContent: t(sec.section) }));
      sec.items.forEach((item) => {
        if (item.type === "palettes") {
          paletteBox = el("div", { className: "palettes" });
          colorsBox = el("div", { className: "swatches" });
          d.append(paletteBox, el("p", { className: "palette-label", textContent: t("customColorsHint") }), colorsBox);
        } else {
          d.append(control(item));
        }
      });
      host.append(d);
    });
    renderPalettes();
    renderCustomColors();
    updateVisibility();
  }
  function updateVisibility() {
    visRows.forEach(([row, show]) => { row.hidden = !show(S()); });
  }

  // ---------- Share / embed / export ----------
  function shareUrl(embed) {
    const shared = { ...S() };
    PRIVATE_KEYS.forEach((k) => delete shared[k]);
    const data = btoa(unescape(encodeURIComponent(JSON.stringify({ e: state.entries, s: shared }))));
    return `${location.origin}${location.pathname}${embed ? "?embed=1" : ""}#w=${data}`;
  }
  function openEmbed() {
    $("shareUrl").value = shareUrl(false);
    const src = shareUrl(true).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    $("embedCode").value =
      `<iframe src="${src}" title="Spin wheel" width="100%" height="640" ` +
      `style="border:0;max-width:640px;display:block;margin:0 auto" allow="autoplay; fullscreen" loading="lazy"></iframe>`;
    $("embedModal").classList.remove("hidden");
  }
  function download(blob, filename) {
    const a = el("a", { href: URL.createObjectURL(blob), download: filename });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function exportWheel() {
    const data = { app: "SpinPick", version: 3, entries: state.entries, settings: S() };
    const name = (S().title || "wheel").replace(/[^\wঀ-৿-]+/g, "_");
    download(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }), `${name}.json`);
  }
  function importWheel(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (Array.isArray(d.entries)) state.entries = d.entries.map(String).slice(0, 1000);
        Object.assign(state.settings, mergeSettings(d.settings, true));
        highlightIdx = -1;
        pendingRemove = -1;
        syncTextarea();
        applyLang();
        Sound.preload();
        save();
        toast(t("tImported"));
      } catch (_) {
        toast(t("tBadFile"));
      }
    };
    r.readAsText(file);
  }
  function resetDesign() {
    if (!confirm(t("cReset"))) return;
    const keep = { title: S().title, theme: S().theme, lang: S().lang };
    state.settings = { ...freshSettings(), ...keep };
    $("tab-customize").innerHTML = "";
    applyLang();
    save();
    toast(t("tReset"));
  }

  // ---------- Misc UI ----------
  let toastTimer;
  function toast(msg) {
    const tEl = $("toast");
    tEl.textContent = msg;
    tEl.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => tEl.classList.add("hidden"), 2200);
  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }
  async function copy(text, msg) {
    try { await navigator.clipboard.writeText(text); toast(msg); }
    catch (_) { prompt("Copy:", text); }
  }
  function entriesChanged() {
    highlightIdx = -1;
    pendingRemove = -1;
    syncTextarea();
    draw();
    save();
  }
  function closeAllModals() {
    if (!$("modal").classList.contains("hidden")) closeModal();
    $("leadModal").classList.add("hidden");
    $("embedModal").classList.add("hidden");
  }

  function bind() {
    ta.addEventListener("input", readTextarea);
    canvas.addEventListener("click", requestSpin);
    $("spinBtn").addEventListener("click", requestSpin);
    $("mSpin").addEventListener("click", requestSpin);
    document.addEventListener("keydown", (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(document.activeElement?.tagName || "");
      const modalOpen = ["modal", "leadModal", "embedModal"].some((id) => !$(id).classList.contains("hidden"));
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !modalOpen) { e.preventDefault(); requestSpin(); }
      else if (e.code === "Space" && !typing && !modalOpen) { e.preventDefault(); requestSpin(); }
      else if (e.key === "Escape") closeAllModals();
    });

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.onclick = () => {
        document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === tab));
        ["entries", "customize", "results"].forEach((n) => $("tab-" + n).classList.toggle("hidden", tab.dataset.tab !== n));
      };
    });

    $("shuffleBtn").onclick = () => { shuffle(state.entries); entriesChanged(); };
    $("sortBtn").onclick = () => { state.entries.sort((a, b) => a.localeCompare(b, undefined, { numeric: true })); entriesChanged(); };
    $("uniqueBtn").onclick = () => {
      const before = state.entries.length;
      state.entries = [...new Set(state.entries)];
      entriesChanged();
      toast(t("tDupes", { n: num(before - state.entries.length) }));
    };
    $("clearBtn").onclick = () => {
      if (state.entries.length && !confirm(t("cClear"))) return;
      state.entries = [];
      entriesChanged();
      ta.focus();
    };
    $("countMinus").onclick = () => setCount(state.entries.length - 1);
    $("countPlus").onclick = () => setCount(state.entries.length + 1);
    $("countInput").onchange = (e) => setCount(e.target.value);

    $("shareBtn").onclick = () => copy(shareUrl(false), t("tLinkCopied"));
    $("embedBtn").onclick = openEmbed;
    $("copyShare").onclick = () => copy($("shareUrl").value, t("tLinkCopied"));
    $("copyEmbed").onclick = () => copy($("embedCode").value, t("tCodeCopied"));
    $("embedClose").onclick = () => $("embedModal").classList.add("hidden");
    $("embedModal").onclick = (e) => { if (e.target.id === "embedModal") $("embedModal").classList.add("hidden"); };

    $("copyResultsBtn").onclick = () => copy(state.results.map((r) => r.name).join("\n"), t("tResultsCopied"));
    $("clearResultsBtn").onclick = () => { state.results = []; renderResults(); save(); };
    $("exportLeadsBtn").onclick = exportLeads;
    $("clearLeadsBtn").onclick = () => {
      if (!state.leads.length || !confirm(t("cClearLeads"))) return;
      state.leads = [];
      renderLeads();
      save();
    };

    $("closeModal").onclick = closeModal;
    $("modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };
    $("removeWinner").onclick = () => { $("modal").classList.add("hidden"); removeIndex(lastWinnerIndex); };
    $("spinAgain").onclick = requestSpin;

    $("leadForm").addEventListener("submit", submitLead);
    $("leadCancel").onclick = () => {
      if ($("leadForm").dataset.mode === "before") $("leadModal").classList.add("hidden");
      else $("leadForm").hidden = true;
    };
    $("leadModal").onclick = (e) => { if (e.target.id === "leadModal") $("leadModal").classList.add("hidden"); };

    const toggleMute = () => { S().muted = !S().muted; applySettings(); save(); };
    $("soundBtn").onclick = toggleMute;
    $("mSound").onclick = toggleMute;
    $("mEdit").onclick = () => $("panel").scrollIntoView({ behavior: "smooth" });
    $("fullBtn").onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else $("stage").requestFullscreen?.();
    };
    $("themeBtn").onclick = () => { S().theme = S().theme === "dark" ? "light" : "dark"; applySettings(); save(); };
    $("langBtn").onclick = () => { S().lang = lang() === "bn" ? "en" : "bn"; applyLang(); save(); };
    $("wheelTitle").oninput = (e) => { S().title = e.target.value; document.title = `${S().title || t("myWheel")} – SpinPick`; save(); };
    $("importFile").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) importWheel(f); };
  }

  // ---------- Init ----------
  if (EMBED) document.body.classList.add("embed");
  load();
  syncTextarea();
  bind();
  applyLang();
  document.fonts?.ready.then(draw);
})();

</script>
</body>
</html>
